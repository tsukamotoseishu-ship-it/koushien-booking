<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貸切湯予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#e8ece9;
    --surface:#ffffff;
    --surface-2:#d8e0dc;
    --ink:#16231f;
    --ink-soft:#4c5c56;
    --indigo:#22385c;
    --ember:#b5522a;
    --ember-soft:#e9c2ac;
    --line:#c7d1cb;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#12181a;
      --surface:#1b2325;
      --surface-2:#232d2f;
      --ink:#eef2ef;
      --ink-soft:#a9b6b1;
      --indigo:#7d9bc7;
      --ember:#e0895d;
      --ember-soft:#5a3524;
      --line:#2e3a3c;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
    padding-inline:16px;
  }
  h1,h2,h3{font-family:"Shippori Mincho","Noto Serif JP",serif;}
  .wrap{max-width:640px;margin:0 auto;}
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    background:var(--paper);
    padding-block:14px 10px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    z-index:5;border-bottom:1px solid var(--line);
  }
  .topbar .brand{font-size:0.72rem;letter-spacing:.14em;color:var(--ink-soft);}
  .topbar h1{margin:2px 0 0;font-size:1.3rem;font-weight:700;}
  .room-chip{display:flex;align-items:center;gap:8px;font-size:0.9rem;}
  .room-chip .num{font-family:"Shippori Mincho",serif;font-size:1.15rem;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums;}
  .room-chip button{border:none;background:none;color:var(--ink-soft);font-size:0.78rem;text-decoration:underline;padding:4px 0;cursor:pointer;}
  .picker{padding-block:28px 40px;}
  .picker h2{font-size:1.5rem;margin:0 0 6px;text-wrap:balance;}
  .picker p{color:var(--ink-soft);font-size:0.92rem;margin:0 0 22px;}
  .floor-label{font-size:0.78rem;letter-spacing:.1em;color:var(--ink-soft);margin:18px 0 8px;}
  .room-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .room-grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:"Shippori Mincho",serif;font-size:1.1rem;font-variant-numeric:tabular-nums;cursor:pointer;}
  .room-grid button:hover{border-color:var(--indigo);}
  .room-grid button:active{background:var(--surface-2);}
  .section-title{font-size:0.78rem;letter-spacing:.12em;color:var(--ink-soft);margin:26px 0 10px;}
  .my-bookings{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .my-bookings .empty{color:var(--ink-soft);font-size:0.88rem;padding:10px 0;}
  .booking-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--ember-soft);border-left:4px solid var(--ember);border-radius:8px;padding:10px 14px;font-size:0.92rem;}
  .booking-row .meta{display:flex;flex-direction:column;gap:2px;}
  .booking-row .meta .fac{font-weight:700;}
  .booking-row .meta .time{color:var(--ink-soft);font-size:0.82rem;font-variant-numeric:tabular-nums;}
  .booking-row button{border:1px solid var(--line);background:none;color:var(--ink-soft);border-radius:6px;padding:6px 10px;font-size:0.8rem;cursor:pointer;}
  .booking-row button:hover{color:var(--ember);border-color:var(--ember);}
  .facility-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .facility-card h3{margin:0 0 2px;font-size:1.05rem;}
  .facility-card .note{color:var(--ink-soft);font-size:0.8rem;margin:0 0 12px;}
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .slot{border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:0.82rem;font-variant-numeric:tabular-nums;padding:10px 4px;text-align:center;cursor:pointer;line-height:1.3;}
  .slot .t{display:block;font-weight:700;}
  .slot .s{display:block;font-size:0.72rem;color:var(--ink-soft);margin-top:2px;}
  .slot[data-state="available"]:hover{border-color:var(--indigo);}
  .slot[data-state="mine"]{background:var(--ember-soft);border-color:var(--ember);color:var(--ink);}
  .slot[data-state="mine"] .s{color:var(--ink-soft);}
  .slot[data-state="taken"],.slot[data-state="past"]{background:transparent;border-style:dashed;color:var(--ink-soft);opacity:.7;cursor:default;}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:608px;margin:0 auto;background:var(--indigo);color:#fff;padding:12px 16px;border-radius:10px;font-size:0.88rem;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:20;}
  .footnote{margin:30px 0 40px;color:var(--ink-soft);font-size:0.78rem;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar" hidden>
    <div>
      <div class="brand">HOTEL KOUSHIEN</div>
      <h1>貸切湯 予約</h1>
    </div>
    <div class="room-chip">
      <span>部屋 <span class="num" id="roomNum">—</span></span>
      <button id="changeRoomBtn" type="button">変更</button>
    </div>
  </div>

  <div id="pickerView" class="picker">
    <h2>あなたの部屋はどこですか？</h2>
    <p>タップして選択すると、予約画面に進みます。</p>
    <div class="floor-label">2階 / 201〜208</div>
    <div class="room-grid" id="roomsFloor2"></div>
    <div class="floor-label">1階 / 101〜108</div>
    <div class="room-grid" id="roomsFloor1"></div>
  </div>

  <div id="bookingView" hidden>
    <div class="section-title">あなたの予約</div>
    <div class="my-bookings" id="myBookings"></div>
    <div class="section-title" id="dateLabel">本日の空き状況</div>
    <div id="facilities"></div>
    <div class="footnote">ご予約後、フロントのレシートに自動で印字されます。</div>
  </div>
</div>
<div id="toast" class="toast" style="display:none;"></div>

<script>
(function(){
  var pickerView = document.getElementById("pickerView");
  var bookingView = document.getElementById("bookingView");
  var topbar = document.getElementById("topbar");
  var roomNumEl = document.getElementById("roomNum");
  var facilitiesEl = document.getElementById("facilities");
  var myBookingsEl = document.getElementById("myBookings");
  var dateLabelEl = document.getElementById("dateLabel");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  var CONFIG = null; // {facilities, rooms, startHour, endHour}
  var room = null;
  var slots = {}; // key facilityId_hour -> {mine:bool} for taken slots

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.style.display = "block";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.style.display = "none"; }, 2400);
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function slotLabel(h){ return h + ":00–" + (h+1) + ":00"; }

  function persistRoom(r){ try { localStorage.setItem("koushien_room", r); } catch(e){} }
  function loadRoom(){
    var hash = (location.hash || "").replace("#","").trim();
    if (hash && CONFIG.rooms.indexOf(hash) !== -1) return hash;
    try {
      var saved = localStorage.getItem("koushien_room");
      if (saved && CONFIG.rooms.indexOf(saved) !== -1) return saved;
    } catch(e){}
    return null;
  }

  function buildRoomGrid(container, list){
    container.innerHTML = "";
    list.forEach(function(r){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = r;
      btn.addEventListener("click", function(){
        room = r;
        persistRoom(r);
        enterBooking();
      });
      container.appendChild(btn);
    });
  }

  document.getElementById("changeRoomBtn").addEventListener("click", function(){
    pickerView.hidden = false;
    bookingView.hidden = true;
  });

  function enterBooking(){
    roomNumEl.textContent = room;
    topbar.hidden = false;
    pickerView.hidden = true;
    bookingView.hidden = false;
    dateLabelEl.textContent = "本日の空き状況(" + CONFIG.startHour + ":00〜" + CONFIG.endHour + ":00)";
    refresh();
  }

  function currentHour(){
    var now = new Date();
    return now.getHours() + now.getMinutes()/60;
  }

  async function refresh(){
    try {
      var res = await fetch("/api/availability?date=" + todayStr() + "&room=" + encodeURIComponent(room));
      var data = await res.json();
      slots = {};
      (data.slots || []).forEach(function(s){
        slots[s.facilityId + "_" + s.hour] = { mine: !!s.mine };
      });
      renderAll();
    } catch (e) {
      console.error("refresh failed", e);
    }
  }

  function renderAll(){
    renderMyBookings();
    renderFacilities();
  }

  function renderMyBookings(){
    myBookingsEl.innerHTML = "";
    var mine = [];
    CONFIG.facilities.forEach(function(f){
      for (var h = CONFIG.startHour; h < CONFIG.endHour; h++){
        var s = slots[f.id + "_" + h];
        if (s && s.mine) mine.push({facility:f, hour:h});
      }
    });
    if (!mine.length){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "まだ予約はありません。下から空き枠を選んでください。";
      myBookingsEl.appendChild(empty);
      return;
    }
    mine.sort(function(a,b){ return a.hour - b.hour; });
    mine.forEach(function(m){
      var row = document.createElement("div");
      row.className = "booking-row";
      var meta = document.createElement("div");
      meta.className = "meta";
      var fac = document.createElement("span");
      fac.className = "fac";
      fac.textContent = m.facility.name;
      var time = document.createElement("span");
      time.className = "time";
      time.textContent = slotLabel(m.hour);
      meta.appendChild(fac);
      meta.appendChild(time);
      var cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.textContent = "取消";
      cancelBtn.addEventListener("click", function(){ cancelBooking(m.facility.id, m.hour); });
      row.appendChild(meta);
      row.appendChild(cancelBtn);
      myBookingsEl.appendChild(row);
    });
  }

  function renderFacilities(){
    facilitiesEl.innerHTML = "";
    CONFIG.facilities.forEach(function(f){
      var card = document.createElement("div");
      card.className = "facility-card";
      var h3 = document.createElement("h3");
      h3.textContent = f.name;
      var note = document.createElement("p");
      note.className = "note";
      note.textContent = f.note;
      var grid = document.createElement("div");
      grid.className = "slot-grid";

      for (var h = CONFIG.startHour; h < CONFIG.endHour; h++){
        (function(h){
          var key = f.id + "_" + h;
          var s = slots[key];
          var btn = document.createElement("button");
          btn.className = "slot";
          btn.type = "button";

          var state;
          if (h + 1 <= currentHour()) state = "past";
          else if (s && s.mine) state = "mine";
          else if (s) state = "taken";
          else state = "available";
          btn.setAttribute("data-state", state);

          var t = document.createElement("span");
          t.className = "t";
          t.textContent = slotLabel(h);
          var sEl = document.createElement("span");
          sEl.className = "s";
          sEl.textContent = state === "available" ? "空き" : state === "mine" ? "予約済(あなた)" : state === "taken" ? "予約済" : "受付終了";
          btn.appendChild(t);
          btn.appendChild(sEl);

          if (state === "available"){
            btn.addEventListener("click", function(){ bookSlot(f, h); });
          }
          grid.appendChild(btn);
        })(h);
      }

      card.appendChild(h3);
      card.appendChild(note);
      card.appendChild(grid);
      facilitiesEl.appendChild(card);
    });
  }

  async function bookSlot(f, h){
    try {
      var res = await fetch("/api/reservations", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ date: todayStr(), facilityId: f.id, hour: h, room: room })
      });
      if (res.status === 409){
        showToast("ちょうど予約が入りました。更新します。");
        await refresh();
        return;
      }
      if (!res.ok){
        showToast("予約に失敗しました。もう一度お試しください。");
        return;
      }
      showToast(f.name + " " + slotLabel(h) + " を予約しました。");
      await refresh();
    } catch (e){
      showToast("通信エラーが発生しました。");
    }
  }

  async function cancelBooking(facilityId, h){
    try {
      var res = await fetch("/api/reservations", {
        method: "DELETE",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ date: todayStr(), facilityId: facilityId, hour: h, room: room })
      });
      if (!res.ok){
        showToast("取消に失敗しました。");
        return;
      }
      showToast("予約を取り消しました。");
      await refresh();
    } catch(e){
      showToast("通信エラーが発生しました。");
    }
  }

  async function boot(){
    var res = await fetch("/api/config");
    CONFIG = await res.json();
    buildRoomGrid(document.getElementById("roomsFloor1"), CONFIG.rooms.slice(0,8));
    buildRoomGrid(document.getElementById("roomsFloor2"), CONFIG.rooms.slice(8,16));

    room = loadRoom();
    if (room) enterBooking();

    setInterval(function(){ if (room) refresh(); }, 5000);
  }

  boot();
})();
</script>
</body>
</html>
